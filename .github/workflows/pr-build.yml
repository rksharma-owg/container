name: Container log follow preflight
run-name: Validate log follow ${{ inputs.contribution_sha }}
on:
  workflow_dispatch:
    inputs:
      contribution_sha:
        required: true
        type: string
      baseline_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, patch]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HAWKEYE_AUTO_INSTALL: '1'
      BUILD_CONFIGURATION: debug
      SOURCE_SHA: ${{ matrix.source == 'baseline' && inputs.baseline_sha || inputs.contribution_sha }}
      BASELINE_SHA: ${{ inputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify source and environment
        id: verify
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          git diff --check "$BASELINE_SHA" HEAD
          echo "Tested SHA: $SOURCE_SHA"
          echo "Baseline SHA: $BASELINE_SHA"
          echo "Source tree: $(git rev-parse HEAD^{tree})"
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.3'
      - name: Unit tests with required compiler flags
        run: make test
      - name: Format and licenses
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          make fmt
          git diff --exit-code
      - name: Generated protobuf
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          make protos
          git diff --exit-code
      - name: Build installer, symbols, and documentation
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: make container dsym docs
      - name: VM integration and combined coverage
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          task_app_root=$(mktemp -d)
          task_log_root="$task_app_root/logs"
          export NO_PROXY="${NO_PROXY:-},192.168.0.0/16,fe80::/10"
          export no_proxy="$NO_PROXY"
          make APP_ROOT="$task_app_root" LOG_ROOT="$task_log_root" install-kernel coverage
          for report in unit integration combined; do
            jq '.data[0].totals.lines.percent' "coverage-reports/$report/coverage-summary.json"
          done
